name: Build Windows Desktop App

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build Standalone Executable with PyInstaller
        run: uv run pyinstaller backend_ide.spec --noconfirm --clean

      - name: Compress Build Artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BackendDevelopmentIDE/* -DestinationPath dist/BackendDevelopmentIDE-Windows.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackendDevelopmentIDE-Windows-x64
          path: dist/BackendDevelopmentIDE-Windows.zip
          retention-days: 14

      - name: Release Binary (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BackendDevelopmentIDE-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
